[package]
name = "d2-morgeth-kick-desktop"
version = "0.3.2"
description = "Lightweight calibration and action runner for D2 Morgeth Kick"
authors = ["D2 Morgeth Kick contributors"]
license = "MIT"
repository = "https://github.com/MIGO-OvO/D2-Morgeth-Kick"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "d2_morgeth_kick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2.10.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
