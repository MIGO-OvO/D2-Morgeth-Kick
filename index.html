<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f8" />
    <link rel="icon" type="image/png" href="/portal/morgath-logo.png" />
    <title>D2 Morgath Kick</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("d2-morgath-kick-theme");
          document.documentElement.dataset.theme = stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: 把脆弱的动作脚本变成一台可检查、可校准、可立即中止的轻量控制台。
      OWN-WORLD: 克制的 Windows 工具语言；明暗两套冷静工作面共用蓝色动作色、精确数值与阶段反馈。
      STORY: 用户先确认运行条件，再沿七阶段轨道理解动作，最后在三栏校准台完成分辨率、落点与时序设置。
      FIRST VIEWPORT: 顶部命令栏、完整七阶段轨道与三栏关键设置同时可见；使用说明和按键设置固定在底部入口。
      FORM: 方向种子 9c8e9d13 后由用户选择标准轻量工具（canon）；构图选择三栏校准台，依据 .impeccable/mocks/comp-c-setup-workbench.webp。
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
